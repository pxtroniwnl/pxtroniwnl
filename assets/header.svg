<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Alejandro Patron Montero — Data Engineer and AI/ML Engineer">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="80%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" y="2" fill="#000000" opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text {
        font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;
      }
      .green { fill: #33ff66; }
      .dim   { fill: #1f9c4c; }
      .faint { fill: #156436; }
      .amber { fill: #ffb000; }
      .boot {
        opacity: 0;
        animation: bootup 0.8s ease-out forwards;
      }
      @keyframes bootup {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      .line { opacity: 0; animation: typed 0.01s steps(1) forwards; }
      .d1 { animation-delay: 0.6s; }
      .d2 { animation-delay: 1.15s; }
      .d3 { animation-delay: 1.7s; }
      .d4 { animation-delay: 2.1s; }
      .d5 { animation-delay: 2.5s; }
      @keyframes typed { to { opacity: 1; } }
      .cursor { animation: blink 1.1s steps(1) infinite; animation-delay: 2.5s; opacity: 0; }
      @keyframes blink {
        0%, 49%  { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .screen { animation: flicker 5s linear infinite; }
      @keyframes flicker {
        0%, 96%, 100% { opacity: 1; }
        97%           { opacity: 0.93; }
        98%           { opacity: 1; }
        99%           { opacity: 0.96; }
      }
    </style>
  </defs>

  <!-- monitor frame -->
  <rect x="1.5" y="1.5" width="897" height="297" rx="14" fill="#050705" stroke="#1f3d26" stroke-width="3"/>

  <g class="boot">
    <g class="screen">
      <!-- title bar -->
      <rect x="3" y="3" width="894" height="38" rx="11" fill="#0e150e"/>
      <rect x="3" y="28" width="894" height="13" fill="#0e150e"/>
      <rect x="22" y="14" width="14" height="14" fill="#ff5050"/>
      <rect x="46" y="14" width="14" height="14" fill="#ffb000"/>
      <rect x="70" y="14" width="14" height="14" fill="#33ff66"/>
      <text x="450" y="28" text-anchor="middle" font-size="15" class="dim">pxtroniwnl@cartagena: ~ — bash</text>

      <!-- session -->
      <g class="line d1">
        <text x="36" y="88" font-size="18"><tspan class="amber">$ </tspan><tspan class="green">whoami</tspan></text>
      </g>
      <g class="line d2">
        <text x="36" y="146" font-size="42" font-weight="bold" class="green" filter="url(#glow)">ALEJANDRO PATRÓN MONTERO</text>
      </g>
      <g class="line d3">
        <text x="36" y="184" font-size="19" font-weight="bold" letter-spacing="2" class="amber" filter="url(#softglow)">&gt; DATA ENGINEER · AI/ML ENGINEER</text>
      </g>
      <g class="line d4">
        <text x="36" y="212" font-size="15" class="dim">&gt; Data Science undergrad @ Universidad Tecnológica de Bolívar — Cartagena, CO</text>
      </g>
      <g class="line d5">
        <text x="36" y="258" font-size="18"><tspan class="amber">$ </tspan><tspan class="faint">./explore --profile</tspan></text>
        <rect class="cursor" x="218" y="243" width="11" height="19" fill="#33ff66"/>
      </g>
    </g>

    <!-- CRT overlays -->
    <rect x="3" y="3" width="894" height="294" rx="12" fill="url(#scanlines)"/>
    <rect x="3" y="3" width="894" height="294" rx="12" fill="url(#vignette)"/>
  </g>
</svg>
